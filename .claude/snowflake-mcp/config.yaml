# Snowflake-Labs MCP 서비스 설정 (읽기 전용 용도)
# 비밀값(계정, 사용자, 토큰)은 이 파일이 아니라 환경 변수로 넘긴다 (루트 .env 참고).
# 주의: README 의 템플릿에서 확인한 항목만 적었다. 이 서버는 SQL 문 종류를 sqlglot 표현식 타입으로 구분하므로,
#       저장소의 템플릿 파일과 비교해서 빠진 종류가 없는지 확인한다 (빠진 것은 False 로 둔다).
#       그리고 1차 방어선은 Snowflake 쪽 읽기 전용 롤(ROLE_MCP_RO)이다.

# Cortex 서비스는 쓰지 않는다 (agent_services / search_services / analyst_services 생략)

other_services:
  object_manager: False     # 객체 생성/수정 도구 사용 안 함
  query_manager: True       # SQL 실행 도구 (아래 sql_statement_permissions 로 SELECT 만 허용)
  semantic_manager: False   # 시맨틱 뷰 도구 사용 안 함

sql_statement_permissions:
  - Select: True            # 조회만 허용 (SHOW/LIST/DESC 등은 Command 로 분류될 수 있어 막혀 있다. 필요하면 확인 후 조정)
  - Alter: False
  - Command: False
  - Create: False
  - Delete: False
  - Drop: False
  - Insert: False
  - Merge: False
  - Update: False
  - Unknown: False
