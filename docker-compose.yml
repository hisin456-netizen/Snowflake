services:

  # ============================================================
  # Oracle Database
  # ============================================================
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    container_name: oracle-free
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

    ports:
      - "1521:1521"

    environment:
      ORACLE_PWD: ${ORACLE_PWD}
      TZ: Asia/Seoul

    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d
      - ./oracle/sample-schemas:/opt/oracle/sample-schemas

    networks:
      - airflow-lab


  # ============================================================
  # RustFS - S3 Compatible Object Storage
  # ============================================================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1

    command: /data

    ports:
      - "9000:9000"
      - "9001:9001"

    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      TZ: Asia/Seoul

    volumes:
      - ./rustfs/data:/data

    networks:
      - airflow-lab


  # ============================================================
  # PostgreSQL - Airflow Metadata Database
  # ============================================================
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    restart: "no" 
    mem_limit: 512m
    cpus: 1

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      TZ: Asia/Seoul

    ports:
      - "5432:5432"
      
    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U airflow -d airflow"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - airflow-lab
      
  # ============================================================
  # Apache Airflow
  # ============================================================
  airflow:
    image: apache/airflow:3.3.2
    container_name: airflow
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2

    depends_on:
      postgres:
        condition: service_healthy
      oracle:
        condition: service_started
      rustfs:
        condition: service_started

    ports:
      - "8081:8080"
      - "127.0.0.1:5678:5678"   # debugpy (dag.test 디버깅용, 로컬에서만 접속)

    environment:

      # --------------------------------------------------------
      # Airflow
      # --------------------------------------------------------
      AIRFLOW__CORE__EXECUTOR: LocalExecutor

      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
        postgresql+psycopg2://airflow:airflow@postgres:5432/airflow

      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

      # --------------------------------------------------------
      # Airflow 3 Simple Auth
      # --------------------------------------------------------
      AIRFLOW__CORE__AUTH_MANAGER: >-
        airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # --------------------------------------------------------
      # Provider packages
      # --------------------------------------------------------
      _PIP_ADDITIONAL_REQUIREMENTS: >-
        apache-airflow-providers-amazon
        apache-airflow-providers-oracle
        debugpy

      AIRFLOW__CORE__FERNET_KEY: "${AIRFLOW_FERNET_KEY}"
      
      AIRFLOW__CORE__TEST_CONNECTION: "Enabled"

      # --------------------------------------------------------
      # 시간대: 전 시스템 KST 통일
      # --------------------------------------------------------
      TZ: Asia/Seoul
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul

    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins

    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow standalone

    networks:
      - airflow-lab


# ==============================================================
# Network
# ==============================================================
networks:
  airflow-lab:
    driver: bridge


# ==============================================================
# Volumes
# ==============================================================
volumes:
  oracle-data:
  postgres-data:
# ==============================================================
# End of yml
# ==============================================================